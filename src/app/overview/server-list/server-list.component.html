<div>
  There are {{ servers().length }} servers.
</div>

<ul>
  @for (server of servers(); track server.id) {
    <li>
      <strong>{{ server.name }}</strong>
      <span>{{ server.description }}</span>
      <span>{{ server.isUp ? 'Up' : 'Down' }}</span>
    </li>
  } @empty {
    <li>No servers found.</li>
  }
</ul>
